name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # pnpm's version comes from packageManager in package.json.
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - run: pnpm open-arch check --file examples/shop/shop.openarch
      - run: pnpm open-arch fmt --check --file examples/shop/shop.openarch
      - run: pnpm open-arch export --check --file examples/shop/shop.openarch
      - run: pnpm open-arch check --file examples/food-delivery/food-delivery.openarch
      - run: pnpm open-arch fmt --check --file examples/food-delivery/food-delivery.openarch
      - run: pnpm open-arch export --check --file examples/food-delivery/food-delivery.openarch

  desktop:
    name: desktop (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    defaults:
      run:
        # The same shell on every OS (Windows would default to PowerShell); the steps use $VAR expansion.
        shell: bash
    env:
      # Build unsigned installers; don't look for a signing identity in the keychain.
      CSC_IDENTITY_AUTO_DISCOVERY: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # Ubuntu 24.04 blocks the unprivileged user namespaces Chromium's sandbox needs,
      # and the Electron in node_modules has no AppArmor profile to allow them.
      - name: Allow Electron's sandbox
        if: runner.os == 'Linux'
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: Smoke test
        if: runner.os == 'Linux'
        run: xvfb-run --auto-servernum --server-args="-screen 0 1920x1080x24" pnpm --filter @open-arch/desktop smoke
      - name: Smoke test
        if: runner.os != 'Linux'
        run: pnpm --filter @open-arch/desktop smoke
      - name: Upload smoke screenshots
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: smoke-${{ runner.os }}
          path: apps/desktop/smoke/*.png
          if-no-files-found: warn

      # --publish never: on CI, electron-builder otherwise tries to publish a draft GitHub release.
      # .deb packages need a homepage; use this repository's until package.json names one.
      - name: Build installers
        run: pnpm --filter @open-arch/desktop dist --publish never -c.extraMetadata.homepage="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY"
      - name: Upload installers
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: installers-${{ runner.os }}
          path: |
            apps/desktop/release/*.dmg
            apps/desktop/release/*.zip
            apps/desktop/release/*.exe
            apps/desktop/release/*.AppImage
            apps/desktop/release/*.deb
          if-no-files-found: error
          retention-days: 14
          # Installers are already compressed.
          compression-level: 0
