name: CI

# Seven machines, three of them macOS and Windows, so not on every push: only when started by hand
# (Actions, CI, Run workflow), or by the Release workflow, with the version to build, before it
# publishes what this built. Branches run the same checks locally with pnpm verify before they're
# merged (AGENTS.md); macOS and Windows are checked only here.
on:
  workflow_dispatch:
  workflow_call:
    inputs:
      version:
        description: The version to build the desktop apps and the share server as. Unset, each is its package.json's.
        type: string
        default: ""

permissions:
  contents: read

env:
  # Read by the share server's build, and passed to electron-builder for the desktop apps.
  OPEN_ARCH_VERSION: ${{ inputs.version }}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # pnpm's version comes from packageManager in package.json.
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The designer's tests run its sharing against the share server, which is in Go.
      - uses: ./.github/actions/go
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm --filter @open-arch/server test
      - run: pnpm build
      - run: pnpm open-arch check --file examples/shop/shop.openarch
      - run: pnpm open-arch fmt --check --file examples/shop/shop.openarch
      - run: pnpm open-arch export --check --file examples/shop/shop.openarch
      - run: pnpm open-arch check --file examples/food-delivery/food-delivery.openarch
      - run: pnpm open-arch fmt --check --file examples/food-delivery/food-delivery.openarch
      - run: pnpm open-arch export --check --file examples/food-delivery/food-delivery.openarch

  desktop:
    name: desktop (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    defaults:
      run:
        # The same shell on every OS (Windows would default to PowerShell); the steps use $VAR expansion.
        shell: bash
    env:
      # Build unsigned installers; don't look for a signing identity in the keychain.
      CSC_IDENTITY_AUTO_DISCOVERY: false
      # The share server the app shares links to (README, The share server). Unset, it doesn't offer sharing.
      VITE_SHARE_SERVER: ${{ vars.SHARE_SERVER }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # Ubuntu 24.04 blocks the unprivileged user namespaces Chromium's sandbox needs,
      # and the Electron in node_modules has no AppArmor profile to allow them.
      - name: Allow Electron's sandbox
        if: runner.os == 'Linux'
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: Smoke test
        if: runner.os == 'Linux'
        run: xvfb-run --auto-servernum --server-args="-screen 0 1920x1080x24" pnpm --filter @open-arch/desktop smoke
      - name: Smoke test
        if: runner.os != 'Linux'
        run: pnpm --filter @open-arch/desktop smoke
      - name: Upload smoke screenshots
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: smoke-${{ runner.os }}
          path: apps/desktop/smoke/*.png
          if-no-files-found: warn

      # --publish never: on CI, electron-builder otherwise tries to publish to a GitHub release,
      # above all when building a release's tag.
      # .deb packages need a homepage; use this repository's until package.json names one.
      - name: Build installers
        # A release's version goes in the app's package.json, and so in the installers' names.
        run: pnpm --filter @open-arch/desktop dist --publish never -c.extraMetadata.homepage="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" ${OPEN_ARCH_VERSION:+-c.extraMetadata.version="$OPEN_ARCH_VERSION"}
      - name: Upload installers
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: installers-${{ runner.os }}
          path: |
            apps/desktop/release/*.dmg
            apps/desktop/release/*.zip
            apps/desktop/release/*.exe
            apps/desktop/release/*.AppImage
            apps/desktop/release/*.deb
          if-no-files-found: error
          retention-days: 14
          # Installers are already compressed.
          compression-level: 0

  # The share server's executables, all built on each machine, then the one for that machine run
  # as a server would run it, after the Go tests. Each uploads its executables as .tar.gz
  # artifacts of the run. The macOS x64 one has no Intel Mac to run on, so it's only checked to be
  # a macOS executable for x64.
  server:
    name: share server (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-x64
            runner: ubuntu-latest
            upload: linux-x64
          - platform: linux-arm64
            runner: ubuntu-24.04-arm
            upload: linux-arm64
          - platform: macos-arm64
            runner: macos-latest
            upload: macos-arm64 macos-x64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - uses: ./.github/actions/go
      - run: pnpm --filter @open-arch/server test
      # Builds release/open-arch-share-<linux|macos>-<x64|arm64>, then runs this machine's (scripts/smoke-executable.mjs).
      - run: pnpm --filter @open-arch/server executable
      - name: Pack the executables
        run: for name in ${{ matrix.upload }}; do tar -czf "open-arch-share-$name.tar.gz" -C apps/server/release "open-arch-share-$name"; done
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: share-server-${{ matrix.platform }}
          path: open-arch-share-*.tar.gz
          if-no-files-found: error
          retention-days: 14
          # Already compressed.
          compression-level: 0
