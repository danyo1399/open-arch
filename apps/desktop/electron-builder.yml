appId: dev.openarch.desktop
productName: open-arch
directories:
  output: release
# The app doesn't update itself, so there's nowhere to publish updates to, and no update files to
# write. electron-builder otherwise looks for one, and fails on a pre-release version like 1.0.0-rc.1.
publish: null
# Main, preload and the web UI are bundled into dist/, so the app needs no node_modules.
files:
  - dist/**
  - package.json
# The CLI the AI agent runs, and the skill it reads, must be plain files for other processes.
asarUnpack:
  - dist/cli/**
mac:
  target: [dmg, zip]
  # Named explicitly, as a release looks for them by name (scripts/release-assets.mjs).
  artifactName: "${productName}-${version}-${arch}-mac.${ext}"
dmg:
  artifactName: "${productName}-${version}-${arch}.${ext}"
  category: public.app-category.developer-tools
win:
  target: [nsis]
nsis:
  # The default, "${productName} Setup ${version}.exe", has spaces, which a GitHub release renames.
  artifactName: "${productName}-${version}-setup.${ext}"
linux:
  target: [AppImage, deb]
  category: Development
  # Linux names the executable after package.json's "name", and "@open-arch/desktop" isn't a valid file name.
  executableName: open-arch
  # .deb packages must name a maintainer (else the author's email) and a homepage.
  # CI passes the repository URL as the homepage until package.json has one.
  maintainer: open-arch
deb:
  # The default, ${name}_..., would put the file in a folder named after the @open-arch scope.
  artifactName: "${productName}_${version}_${arch}.${ext}"
